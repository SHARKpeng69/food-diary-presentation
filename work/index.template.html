function syncMotion(){reduced=Boolean(reduced);syncHomeModel();syncDescriptionLayers();syncReflection();syncReferences();frame.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'Motion off':'Motion on';$('motion').setAttribute('aria-pressed',String(reduced));hover.tx=hover.ty=0;if(reduced){velocity.yaw=velocity.pitch=0;for(const a of animations.slice())a.finish();if(tween){pose={...tween.to};const done=tween.resolve;tween=null;done();}}wake();}

function scheduleReveal(){if(closing||!splashDone||state!=='intro')return;const remaining=(film.duration-film.currentTime-.45)/2;if(Number.isFinite(remaining)){clearTimeout(revealTimer);const token=introToken;revealTimer=setTimeout(()=>reveal(token),Math.max(300,remaining*1000));}}
